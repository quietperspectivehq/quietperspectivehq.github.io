<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Perspective</title>
  <desc id="desc">A circular sunrise and winding path emblem in evergreen, ivory and gold.</desc>
  <defs><clipPath id="badge"><circle cx="256" cy="256" r="247"/></clipPath></defs>
  <circle cx="256" cy="256" r="247" fill="#fefaeb"/>
  <image x="11" y="11" width="490" height="490" preserveAspectRatio="xMidYMid meet"
         clip-path="url(#badge)" href="data:image/webp;base64,"/>
  <circle cx="256" cy="256" r="247" fill="none" stroke="#0a383d" stroke-width="6"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#d9b66d" stroke-width="1.7"/>
</svg>
